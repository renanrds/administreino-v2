services:
  db:
    image: postgres:17
    container_name: administreino_db_prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Sem porta exposta — acesso apenas pela rede interna

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: administreino_backend_prod
    command: >
      sh -c "python manage.py migrate --no-input && python manage.py collectstatic --no-input && exec gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/schema/')\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: administreino_nginx_prod
#    ports:
#      - "80:80"
#      - "443:443"
    volumes:
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
#      - ./nginx/certbot/conf:/etc/letsencrypt:ro
#      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: administreino_tunnel_prod
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - nginx

#  certbot:
#    image: certbot/certbot:latest
#    container_name: administreino_certbot
#    volumes:
#      - ./nginx/certbot/conf:/etc/letsencrypt
#      - ./nginx/certbot/www:/var/www/certbot
#    # Executado manualmente via: make init-ssl ou make renew-ssl
#    # Sem restart_policy — não é um serviço contínuo

volumes:
  postgres_data:
  static_files:
  media_files:
