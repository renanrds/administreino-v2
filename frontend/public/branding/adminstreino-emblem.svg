<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090C16"/>
      <stop offset="1" stop-color="#03050D"/>
    </linearGradient>
    <linearGradient id="neon" x1="240" y1="360" x2="790" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB34D"/>
      <stop offset="0.48" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#FF5A00"/>
    </linearGradient>
    <filter id="glowHeavy" x="100" y="250" width="824" height="524" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="130" y="280" width="764" height="464" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Dumbbell base silhouette -->
  <g id="db-main" stroke="url(#neon)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="170" y="470" width="36" height="84" rx="10" stroke-width="12"/>
    <rect x="206" y="430" width="58" height="164" rx="10" stroke-width="12"/>
    <rect x="264" y="390" width="90" height="244" rx="12" stroke-width="12"/>

    <rect x="670" y="390" width="90" height="244" rx="12" stroke-width="12"/>
    <rect x="760" y="430" width="58" height="164" rx="10" stroke-width="12"/>
    <rect x="818" y="470" width="36" height="84" rx="10" stroke-width="12"/>

    <rect x="354" y="500" width="316" height="24" rx="10" stroke-width="10"/>
  </g>

  <g filter="url(#glowHeavy)">
    <use href="#db-main" stroke="#FF6A00"/>
  </g>

  <!-- Inner tunnel lines inspired by the original recursive effect -->
  <g filter="url(#glowSoft)" stroke="url(#neon)" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <rect x="176" y="482" width="18" height="58" rx="7" stroke-width="4"/>
    <rect x="198" y="446" width="34" height="132" rx="8" stroke-width="4"/>
    <rect x="236" y="418" width="56" height="188" rx="8" stroke-width="5"/>
    <rect x="292" y="497" width="440" height="30" rx="10" stroke-width="3"/>
    <rect x="732" y="418" width="56" height="188" rx="8" stroke-width="5"/>
    <rect x="792" y="446" width="34" height="132" rx="8" stroke-width="4"/>
    <rect x="830" y="482" width="18" height="58" rx="7" stroke-width="4"/>

    <rect x="183" y="491" width="10" height="40" rx="4" stroke-width="2.2" opacity="0.8"/>
    <rect x="211" y="460" width="12" height="104" rx="5" stroke-width="2.2" opacity="0.8"/>
    <rect x="801" y="460" width="12" height="104" rx="5" stroke-width="2.2" opacity="0.8"/>
    <rect x="831" y="491" width="10" height="40" rx="4" stroke-width="2.2" opacity="0.8"/>
  </g>
</svg>
