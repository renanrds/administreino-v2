<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090C16"/>
      <stop offset="1" stop-color="#03050D"/>
    </linearGradient>
    <linearGradient id="neon" x1="110" y1="180" x2="610" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB34D"/>
      <stop offset="0.48" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#FF5A00"/>
    </linearGradient>
    <filter id="glow" x="40" y="80" width="690" height="390" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="b1"/>
      <feGaussianBlur stdDeviation="16" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="670" y="120" width="890" height="260" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.8"/>
    </filter>
  </defs>

  <rect width="1600" height="560" rx="28" fill="url(#bg)"/>

  <!-- Dumbbell symbol -->
  <g id="db" stroke="url(#neon)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="108" y="240" width="22" height="78" rx="8" stroke-width="8"/>
    <rect x="130" y="208" width="34" height="142" rx="8" stroke-width="8"/>
    <rect x="164" y="176" width="58" height="206" rx="10" stroke-width="8"/>

    <rect x="448" y="176" width="58" height="206" rx="10" stroke-width="8"/>
    <rect x="506" y="208" width="34" height="142" rx="8" stroke-width="8"/>
    <rect x="540" y="240" width="22" height="78" rx="8" stroke-width="8"/>

    <rect x="222" y="267" width="226" height="24" rx="9" stroke-width="7"/>

    <!-- Inner recursion lines -->
    <rect x="113" y="252" width="8" height="54" rx="4" stroke-width="2.2" opacity="0.88"/>
    <rect x="136" y="223" width="12" height="112" rx="5" stroke-width="2.4" opacity="0.88"/>
    <rect x="171" y="198" width="22" height="162" rx="6" stroke-width="2.6" opacity="0.88"/>
    <rect x="193" y="270" width="304" height="18" rx="7" stroke-width="2.4" opacity="0.9"/>
    <rect x="477" y="198" width="22" height="162" rx="6" stroke-width="2.6" opacity="0.88"/>
    <rect x="522" y="223" width="12" height="112" rx="5" stroke-width="2.4" opacity="0.88"/>
    <rect x="541" y="252" width="8" height="54" rx="4" stroke-width="2.2" opacity="0.88"/>
  </g>

  <g filter="url(#glow)">
    <use href="#db" stroke="#FF6A00"/>
  </g>

  <g filter="url(#textGlow)">
    <text x="700" y="274" fill="#F3F4F6" font-size="108" font-family="'Trebuchet MS', 'Avenir Next', 'Segoe UI', sans-serif" font-weight="800" letter-spacing="2">Adminis</text>
    <text x="1134" y="274" fill="#FF8A1F" font-size="108" font-family="'Trebuchet MS', 'Avenir Next', 'Segoe UI', sans-serif" font-weight="800" letter-spacing="2">treino</text>
  </g>
  <text x="700" y="274" fill="#F8FAFC" font-size="108" font-family="'Trebuchet MS', 'Avenir Next', 'Segoe UI', sans-serif" font-weight="800" letter-spacing="2">Adminis</text>
  <text x="1134" y="274" fill="#FF8A1F" font-size="108" font-family="'Trebuchet MS', 'Avenir Next', 'Segoe UI', sans-serif" font-weight="800" letter-spacing="2">treino</text>
  <text x="705" y="342" fill="#7A8AA3" font-size="38" font-family="'Trebuchet MS', 'Avenir Next', 'Segoe UI', sans-serif" letter-spacing="2">Gestão de Treinos</text>
</svg>
